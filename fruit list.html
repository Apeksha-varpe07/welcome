<!DOCTYPE html>
<html>
<head>
    <title>Fruit List</title>
</head>
<body>

<h2>Select Fruit</h2>

<input list="fruits">

<datalist id="fruits">
    <option value="Apple">
    <option value="Banana">
    <option value="Orange">
    <option value="Mango">
    <option value="Grapes">
</datalist>

</body>
</html>
