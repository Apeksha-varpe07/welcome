<!DOCTYPE html>
<html>
<head>
    <title>Datalist Example</title>
</head>
<body>

<h2>Select a Programming Language</h2>

<input list="languages" placeholder="Choose language">

<datalist id="languages">
    <option value="HTML">
    <option value="CSS">
    <option value="JavaScript">
    <option value="Python">
    <option value="Java">
</datalist>

</body>
</html>
