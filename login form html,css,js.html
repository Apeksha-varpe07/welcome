<!DOCTYPE html>
<html>
<head>
    <title>Professional Login Form</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(to right,#4facfe,#00f2fe);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 5px 15px rgba(0,0,0,0.3);
        }

        .login h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        .login input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
            font-size:16px;
        }

        .login button{
            width:100%;
            padding:12px;
            background:#007BFF;
            color:white;
            border:none;
            border-radius:5px;
            font-size:18px;
            cursor:pointer;
        }

        .login button:hover{
            background:#0056b3;
        }

        .message{
            text-align:center;
            margin-top:10px;
            color:red;
        }
    </style>
</head>

<body>

<div class="login">
    <h2>Login Form</h2>

    <form onsubmit="return validate()">

        <input type="text" id="username" placeholder="Enter Username">

        <input type="password" id="password" placeholder="Enter Password">

        <button type="submit">Login</button>

        <p id="msg" class="message"></p>

    </form>
</div>

<script>

function validate(){

    var user=document.getElementById("username").value;
    var pass=document.getElementById("password").value;

    if(user==""){
        document.getElementById("msg").innerHTML="Enter Username";
        return false;
    }

    if(pass==""){
        document.getElementById("msg").innerHTML="Enter Password";
        return false;
    }

    if(user=="admin" && pass=="12345"){
        alert("Login Successful");
        return true;
    }
    else{
        document.getElementById("msg").innerHTML="Invalid Username or Password";
        return false;
    }

}

</script>

</body>
</html>
