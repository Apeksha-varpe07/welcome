<!DOCTYPE html>
<html>
<head>
    <title>Browser List</title>
</head>
<body>

<h2>Select Browser</h2>

<input list="browser">

<datalist id="browser">
    <option value="Google Chrome">
    <option value="Mozilla Firefox">
    <option value="Microsoft Edge">
    <option value="Safari">
    <option value="Opera">
</datalist>

</body>
</html>
